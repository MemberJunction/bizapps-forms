<div class="vre">
  @if (!hasAnyControl) {
    <p class="vre-empty">No validation options for this question type.</p>
  }

  @if (showLength) {
    <div>
      <label class="vre-label" for="vre-minlen">Min length</label>
      <input
        #minLenInput
        id="vre-minlen"
        type="number"
        min="0"
        class="mjf-input"
        [value]="_rule.minLength ?? ''"
        [attr.aria-invalid]="conflict ? 'true' : null"
        (change)="setNumber('minLength', minLenInput.value)"
      />
    </div>
    <div>
      <label class="vre-label" for="vre-maxlen">Max length</label>
      <input
        #maxLenInput
        id="vre-maxlen"
        type="number"
        min="0"
        class="mjf-input"
        [value]="_rule.maxLength ?? ''"
        [attr.aria-invalid]="conflict ? 'true' : null"
        (change)="setNumber('maxLength', maxLenInput.value)"
      />
    </div>
  }

  @if (showRange) {
    <div>
      <label class="vre-label" for="vre-min">Minimum value</label>
      <input
        #minInput
        id="vre-min"
        type="number"
        class="mjf-input"
        [value]="_rule.min ?? ''"
        [attr.aria-invalid]="conflict ? 'true' : null"
        (change)="setNumber('min', minInput.value)"
      />
    </div>
    <div>
      <label class="vre-label" for="vre-max">Maximum value</label>
      <input
        #maxInput
        id="vre-max"
        type="number"
        class="mjf-input"
        [value]="_rule.max ?? ''"
        [attr.aria-invalid]="conflict ? 'true' : null"
        (change)="setNumber('max', maxInput.value)"
      />
    </div>
  }

  <!-- Both bounds stay on screen while this stands: they are the two numbers the author has to
       reconcile, and the second sentence is what keeps the refusal from being silent. -->
  @if (conflict) {
    <div class="vre-conflict mjf-alert" role="alert">
      <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
      <div>
        <p>{{ conflict }}</p>
        <p>Answer validation is not saved until this is fixed.</p>
      </div>
    </div>
  }

  @if (showPattern) {
    <div class="vre-full">
      <label class="vre-label" for="vre-pattern">Pattern (regular expression)</label>
      <input
        #patternInput
        id="vre-pattern"
        type="text"
        class="mjf-input"
        placeholder="^[A-Z]{2}\d+$"
        [value]="_rule.pattern ?? ''"
        (change)="setPattern(patternInput.value)"
      />
    </div>
    <div class="vre-full">
      <label class="vre-label" for="vre-patternmsg">Message shown when the pattern fails</label>
      <input
        #patternMsgInput
        id="vre-patternmsg"
        type="text"
        class="mjf-input"
        placeholder="Please enter a valid value"
        [value]="_rule.patternMessage ?? ''"
        (change)="setPatternMessage(patternMsgInput.value)"
      />
    </div>
  }
</div>
