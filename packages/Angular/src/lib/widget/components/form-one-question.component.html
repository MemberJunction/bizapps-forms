<div class="mjf-oneq">
  <!--
    Nothing to fill in, nothing to report: the bar would be a control with no subject and the live
    region beside it would announce "1 of 0". The readiness line goes with them deliberately — it
    exists to explain a bar that is not full, so with no bar there is nothing for it to say, and
    the Submit button below is the whole affordance. Same predicate as the scroll renderer, read
    off the runtime so the two cannot drift.
  -->
  @if (runtime().hasAnswerableQuestions()) {
    <div class="mjf-oneq__progress">
      <mjf-form-progress [value]="progress()" [ready]="readyToSubmit()" />
      <span class="mjf-oneq__step" aria-live="polite">{{ stepLabel() }}</span>
    </div>
  }

  @if (current(); as q) {
    <div class="mjf-oneq__card" tabindex="-1" (keydown)="onKeydown($event)">
      <mjf-form-question
        [question]="q"
        [value]="runtime().valueFor(q.id)"
        [errorMessage]="runtime().visibleErrorFor(q)"
        [partErrors]="runtime().visiblePartErrorsFor(q)"
        [distributionSlug]="distributionSlug()"
        [responseId]="responseId()"
        (valueChange)="onValueChange(q, $event)"
        (focusout)="onBlur(q, $event)"
      />

      <div class="mjf-oneq__nav">
        <button
          type="button"
          class="mjf-oneq__btn mjf-oneq__btn--ghost"
          [disabled]="isFirst() || submitting()"
          (click)="onBack()"
        >Back</button>

        <button
          type="button"
          class="mjf-oneq__btn mjf-oneq__btn--primary"
          [disabled]="primaryDisabled()"
          (click)="onNext()"
        >
          @if (isLast()) {
            @if (submitting()) { <span>Submitting…</span> } @else { <span>Submit</span> }
          } @else {
            <span>Next</span>
          }
        </button>
      </div>
    </div>
  } @else {
    <p class="mjf-oneq__empty">This form has no questions to display.</p>
  }
</div>
