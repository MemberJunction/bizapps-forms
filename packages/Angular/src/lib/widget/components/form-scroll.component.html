<div class="mjf-scroll">
  <div class="mjf-scroll__progress">
    <mjf-form-progress [value]="progress()" />
  </div>

  <!--
    Native `submit`, not `(ngSubmit)`. This component is standalone and does NOT import
    FormsModule (the widget has its own FormRuntime and uses no ngModel), so Angular's
    NgForm directive never applies to this element and `(ngSubmit)` binds to nothing.
    The browser therefore ran its default GET submit: the page navigated to `?`, tearing
    down the component and aborting the in-flight submit mutation — every respondent lost
    their answers. The <form> element itself is kept for semantics (screen readers, and
    the mobile keyboard's "Go" affordance); `preventDefault` is now explicit.
  -->
  <form class="mjf-scroll__body" (submit)="onSubmit($event)" novalidate>
    @for (page of pages(); track page.id) {
      <section class="mjf-page" [attr.aria-label]="page.title || 'Section'">
        @if (page.title) {
          <h2 class="mjf-page__title">{{ page.title }}</h2>
        }
        @if (page.description) {
          <p class="mjf-page__desc">{{ page.description }}</p>
        }
        <div class="mjf-page__questions">
          @for (q of questionsFor(page); track q.id) {
            <mjf-form-question
              [question]="q"
              [value]="runtime().valueFor(q.id)"
              [errorMessage]="runtime().visibleErrorFor(q)"
              [distributionSlug]="distributionSlug()"
              [responseId]="responseId()"
              (valueChange)="onValueChange(q, $event)"
              (focusout)="onBlur(q, $event)"
            />
          }
        </div>
      </section>
    }

    <div class="mjf-scroll__actions">
      <button type="submit" class="mjf-submit" [disabled]="submitting() || submitDisabled()">
        @if (submitting()) {
          <span>Submitting…</span>
        } @else {
          <span>Submit</span>
        }
      </button>
    </div>
  </form>
</div>
