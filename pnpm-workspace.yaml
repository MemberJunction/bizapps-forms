# pnpm workspace definition. The npm `workspaces` array in package.json is left in place
# because the OpenApp install engine still reads it (findWorkspacePackageJsonFiles) — pnpm
# itself ignores it and uses this file. Keep the two `packages/*` globs in sync; the
# `apps/MJAPI` entry below is deliberately pnpm-only (see its own note).
#
# CORRECTED 2026-08-18: this note used to also credit "the publish workflow's jq steps" with
# reading `workspaces`. No workflow reads that field — `grep -rn workspaces .github/` returns
# nothing; every jq in publish.yml reads a fixed path (packages/Entities/package.json or
# mj-app.json). The claim survived into a PR description before anyone checked it.

# LOAD-BEARING. pnpm 10 defaults this to false, which makes internal deps pinned at
# an exact version resolve from the REGISTRY instead of linking to the local package.
# For an unpublished version that fails loudly; for a published one it silently
# installs a stale copy. This repo pins its own workspace packages at exact
# versions, so without this every workspace link becomes a registry download.
linkWorkspacePackages: true

# Peer handling (strict-peer-dependencies, auto-install-peers) lives in .npmrc.


# pnpm 10 does not run dependency build scripts unless they are allowlisted here.
# Anything omitted installs without its native/postinstall step and fails later at
# runtime rather than at install. Kept verbatim in sync with the MJ core allowlist
# rather than trimmed to today's tree: entries for absent packages are inert, and a
# trimmed list silently regresses the moment a transitive dep reappears.
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@google/genai'
  - '@parcel/watcher'
  - '@zoom/rtms'
  - browser-tabs-lock
  - core-js
  - core-js-pure
  - esbuild
  - isolated-vm
  - lmdb
  - msgpackr-extract
  - oracledb
  - protobufjs
  - rete
  - sharp
  - tesseract.js

packages:
  - 'packages/*'
  # The MJAPI dev harness is a workspace member so its @memberjunction/* deps dedupe
  # against packages/* through one lockfile. Outside the workspace it resolves its own
  # copies of graphql/@memberjunction/server, and two instances split the type-graphql
  # registry: schema generation then dies at boot (duplicate "RunViewByIDInput" /
  # CannotDetermineGraphQLTypeError) — the 2026-08-18 estate failure. What keeps the harness
  # out of any release is `"private": true` in its package.json, not this list. It is also
  # deliberately absent from package.json `workspaces`, which the OpenApp install engine
  # enumerates (findWorkspacePackageJsonFiles) — so the two glob lists are NOT in sync, and
  # the note at the top of this file is scoped to the `packages/*` entry they share.
  - 'apps/MJAPI'
