name: Build and Publish

on:
  push:
    branches: [main]
  # No `targetVersion` input any more. It existed to override a version this workflow computed
  # itself with `changeset version`; since #177 the bump arrives already committed on the release
  # pull request, so the version is read from packages/Entities/package.json and there is nothing
  # here to override. A dispatch re-runs the publish for whatever version the ref carries.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate pnpm-lock.yaml case-sensitivity
        run: ./.github/scripts/validate-package-lock-case.sh

      - name: Validate migration filenames
        run: ./.github/scripts/validate-migration-filenames.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all packages exist on npm
        if: github.ref == 'refs/heads/main'
        run: ./.github/scripts/validate-npm-packages.sh

      - name: Validate repository.url for npm provenance
        run: ./.github/scripts/validate-package-repository.sh

      - name: Configure git credentials
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # #177: this workflow no longer writes to the repository. Required status checks are
      # evaluated against the check runs on the SHA being introduced, and a direct push introduces
      # a SHA the remote has never seen — so no check run can exist for it and the push is rejected
      # permanently (GH013). That is not a race a retry wins, which is why the version bump moved
      # onto the release pull request (docs/release.md) instead of being worked around here.
      #
      # What is left is a pure reader of the tree it was handed, plus one tag push. Tags are
      # untouched: both rulesets are `target: branch`, scoped to refs/heads/main and refs/heads/next.
      #
      # The gate below replaces "are there changesets to consume?", which was the right question
      # only while this workflow ran `changeset version` itself:
      #
      #   pending changesets | version on npm | what it means
      #   -------------------|----------------|-----------------------------------------------
      #   > 0                | —              | the release PR never ran `pnpm run version` — FAIL
      #   0                  | yes            | already released; nothing to do
      #   0                  | no             | publish and tag
      - name: The bump has to have happened before this branch was merged
        run: |
          PENDING=$(find .changeset -name "*.md" -not -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PENDING" -ne 0 ]; then
            VERSION=$(jq -r .version packages/Entities/package.json)
            echo "::error::$PENDING changeset(s) are still on this branch, so the version was never bumped. Publishing now would republish $VERSION. Cut the release on a branch off next with 'pnpm run version' and open the release PR — see docs/release.md."
            exit 1
          fi

      # Answers `publish` and `tag` SEPARATELY. They used to be one output derived from a single
      # question — is packages/Entities' version on npm? — which reads a partially published release
      # as a finished one: `changeset publish` publishes concurrently, so one package landing while a
      # sibling fails is a state it produces by design and expects a retry to finish. That retry
      # skipped publish AND tag and reported success. See scripts/release-plan.mjs for the whole
      # argument; its spec pins the three states, and both run in build-and-test.
      - name: What is there to release?
        id: release_check
        run: node scripts/release-plan.mjs

      # The derivation used to happen here, in bash, and was persisted by the push #177 removed.
      # It happens on the release PR now (`pnpm run version`), so this end only verifies — a
      # hand-edited mj-app.json, or a release PR that skipped the script, stops the release before
      # anything reaches npm.
      - name: mj-app.json agrees with the packages being published
        if: steps.release_check.outputs.work == 'true'
        run: node scripts/sync-app-version.mjs --check

      # A migration is a schema change, so it must not ship as a patch. changes.yml enforces the
      # rule on PRs into `next` by reading the changeset; by the time a release runs, the changesets
      # are consumed and gone, so this backstop asks the same question of the artifacts instead:
      # did migrations/ move since the last release, and did the version move by more than a patch?
      #
      # Deliberately carries NO ref condition — it must hold on every path that can cut a release,
      # including workflow_dispatch. A dry run of this workflow dispatched from `next` once shipped
      # 0.3.1 — a patch — carrying a new migration, and tagged it, because the gate lived inside a
      # step that path never reaches.
      #
      # It reads the shipped artifacts rather than `.changeset/*.md` for the same reason it now runs
      # at all: the changesets are gone by this point, and a gate that reads a file which is always
      # empty is a gate that always passes.
      - name: Enforce schema-change version policy
        if: steps.release_check.outputs.work == 'true'
        env:
          VERSION: ${{ steps.release_check.outputs.VERSION }}
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous v* tag — first release, no previously-shipped schema to have changed"
            exit 0
          fi

          NEW_MIGRATIONS=$(git --no-pager diff --name-only "$LAST_TAG" "$GITHUB_SHA" -- migrations/ || true)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No migrations changed since $LAST_TAG — a patch release is in policy"
            exit 0
          fi

          PREV="${LAST_TAG#v}"
          IFS='.' read -r PREV_MAJOR PREV_MINOR _ <<< "$PREV"
          IFS='.' read -r NEW_MAJOR NEW_MINOR _ <<< "$VERSION"
          if [ "$NEW_MAJOR" -gt "$PREV_MAJOR" ] || [ "$NEW_MINOR" -gt "$PREV_MINOR" ]; then
            echo "migrations/ changed since $LAST_TAG and $PREV -> $VERSION is at least a minor — in policy"
            exit 0
          fi

          echo "$NEW_MIGRATIONS"
          echo "::error::migrations/ changed since $LAST_TAG but $PREV -> $VERSION is only a patch. A schema change must ship as at least a minor. Redo the release PR with a 'minor' changeset."
          exit 1

      # RELEASE READINESS, and the only place this runs. PRs contribute declarative JSON under
      # metadata/ and no Metadata_Sync migration; the build engineer generates ONE consolidated seed
      # per release from a clean database (MJ/metadata/CLAUDE.md §1b and §10). Nothing on a feature
      # PR can tell whether that has happened yet, and asking every PR would re-impose the per-PR
      # cadence MJ rules out — so the question is asked HERE, at the release, where the answer is
      # actionable: does every primaryKey declared under metadata/ appear in a shipped migration?
      #
      # A red step means the release seed has not been regenerated. Fix it by generating the
      # Metadata_Sync (migrations/README.md) — never by editing this step. It sits before `Publish
      # to npm` and the tag, so a failure here costs nothing but a re-run.
      #
      # The self-test runs first, for the reason the check exists at all: a gate nobody has watched
      # fail is indistinguishable from one that returns "pass" unconditionally, which is precisely
      # how its predecessor went green over a record that shipped nowhere (#105). Node stdlib only,
      # so neither needs anything installed.
      - name: Release readiness (every metadata record is in the shipped seed)
        if: steps.release_check.outputs.work == 'true'
        run: |
          node scripts/check-release-seed-coverage.spec.mjs
          npm run check:release-seed

      # The OTHER half of #105, and the one coverage structurally cannot ask. Coverage answers "is
      # this ID named by some shipped migration?" — a per-PR seed delta satisfies that perfectly
      # while being exactly the cadence #105 abolished, so coverage would go green over it forever.
      # This asks whether the release ships ONE consolidated seed or a pile of per-PR deltas.
      #
      # Separate step, not folded into the one above, so a red run names the rule that broke. It is
      # also a separate SCRIPT because it needs git tags to know what has shipped, and the coverage
      # check is deliberately pure-fs so it runs on any checkout — `fetch-depth: 0` and
      # `fetch-tags: true` on this job's checkout are what make the tags available here.
      - name: Release readiness (one consolidated seed, not per-PR deltas)
        if: steps.release_check.outputs.work == 'true'
        run: |
          node scripts/check-release-seed-cadence.spec.mjs
          npm run check:seed-cadence

      - name: Build all packages
        run: pnpm run build:packages

      # Four consecutive releases (0.2.0, 0.2.1, 0.3.0, 0.4.0) shipped forms-ng without its <mj-form>
      # browser bundle, so every public form rendered an empty shell. Nothing failed at build, test or
      # boot time — the artifact was simply absent from the tarball. This is the last point at
      # which that is still catchable.
      - name: Validate the forms-ng widget bundle will ship
        run: ./.github/scripts/validate-widget-bundle.sh

      - name: Publish to npm
        if: steps.release_check.outputs.publish == 'true'
        run: pnpm exec changeset publish

      # The one remote write this workflow still makes. Tags are outside both rulesets — they are
      # `target: branch`, scoped to refs/heads/main and refs/heads/next — so this is not the push
      # #177 is about, and check-release-pushes.mjs allows it for that reason.
      #
      # `changeset publish` has already created its own per-package tags locally; this adds the
      # single repo-wide `v<version>` that the release-readiness checks and the schema-policy gate
      # above both read, and pushes only that one.
      #
      # Gated on `tag`, NOT on `publish`. The two are different questions and a release can fail
      # between them: if every package published and only the tag push failed, `publish` is false on
      # the retry while the tag is still missing — and check-release-seed-cadence.mjs reads the
      # newest `v*` tag to decide what has shipped, so the missing tag would fail the NEXT release.
      - name: Tag the release
        if: steps.release_check.outputs.tag == 'true'
        env:
          VERSION: ${{ steps.release_check.outputs.VERSION }}
        run: |
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          {
            echo "## Published v$VERSION"
            echo ""
            echo "**Next step, and it is manual on purpose:** open a pull request from \`main\` into \`next\` to carry this release's merge commit back. Until it merges, \`next\` is not up to date with \`main\` and the following release PR cannot merge. See [\`docs/release.md\`](docs/release.md)."
          } >> "$GITHUB_STEP_SUMMARY"
