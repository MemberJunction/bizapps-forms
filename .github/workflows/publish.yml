name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targetVersion:
        description: 'Target version (e.g., 5.27.2). Leave empty for auto-detection.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate pnpm-lock.yaml case-sensitivity
        run: ./.github/scripts/validate-package-lock-case.sh

      - name: Validate migration filenames
        run: ./.github/scripts/validate-migration-filenames.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all packages exist on npm
        if: github.ref == 'refs/heads/main'
        run: ./.github/scripts/validate-npm-packages.sh

      - name: Validate repository.url for npm provenance
        run: ./.github/scripts/validate-package-repository.sh

      - name: Configure git credentials
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Check for pending changesets
        id: changeset_check
        run: |
          PENDING=$(find .changeset -name "*.md" -not -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          if [ "$PENDING" -eq 0 ]; then
            echo "No pending changesets — nothing to publish"
          else
            echo "Found $PENDING pending changeset(s)"
          fi

      - name: Determine declared version bump
        if: steps.changeset_check.outputs.pending != '0'
        id: declared_bump
        run: |
          # Current version from the entities package — any of them works, since `fixed` in
          # .changeset/config.json moves every @mj-biz-apps package together.
          CURRENT_VERSION=$(jq -r .version packages/Entities/package.json)

          # What the release will be is whatever the changesets declare, because that is what
          # `changeset version` will actually do. Nothing else may move this number — see the
          # policy gate below for why the schema-change rule cannot be enforced by nudging it.
          # `@changesets/write` always double-quotes the package name; single quotes are matched too
          # because changesets accepts them, so a hand-authored file is not silently passed over.
          DECLARED_BUMP=patch
          for f in .changeset/*.md; do
            [ "$f" = ".changeset/README.md" ] && continue
            [ ! -f "$f" ] && continue
            if grep -qE "^['\"]@mj-biz-apps/[^'\"]+['\"]:[[:space:]]*major" "$f"; then
              DECLARED_BUMP=major
              break
            fi
            if grep -qE "^['\"]@mj-biz-apps/[^'\"]+['\"]:[[:space:]]*minor" "$f"; then
              DECLARED_BUMP=minor
            fi
          done

          echo "Current version: $CURRENT_VERSION"
          echo "Highest bump declared across changesets: $DECLARED_BUMP"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "DECLARED_BUMP=$DECLARED_BUMP" >> "$GITHUB_OUTPUT"

      # Deliberately carries NO ref or targetVersion condition: this must hold on every path
      # that can cut a release. See the comment inside for what happens when it does not.
      - name: Enforce schema-change version policy
        if: steps.changeset_check.outputs.pending != '0'
        env:
          CURRENT_VERSION: ${{ steps.declared_bump.outputs.CURRENT_VERSION }}
          DECLARED_BUMP: ${{ steps.declared_bump.outputs.DECLARED_BUMP }}
        run: |
          # A migration is a schema change, so it must not ship as a patch. This is a POLICY GATE,
          # kept as its own step rather than folded into the prediction below, for two reasons.
          #
          # 1. The rule CANNOT be enforced by adjusting the predicted bump. `changeset version`
          #    reads only `.changeset/*.md` and knows nothing about `migrations/`, so raising the
          #    prediction moves the expectation away from what will actually happen, and the
          #    mismatch guard then aborts the release reporting a predictor error instead of the
          #    missing changeset — the exact failure this step exists to remove.
          # 2. It has to hold on every path that releases. The prediction below only runs for an
          #    auto-detected release from `main`; a `workflow_dispatch` skips it and publishes
          #    anyway. A dry run of this workflow dispatched from `next` shipped 0.3.1 — a patch —
          #    carrying a new migration, and tagged it, because the gate lived inside a step that
          #    path never reaches.
          #
          # (changes.yml enforces the same rule on PRs into `next`; this is the backstop for
          # anything that reached a release another way.)
          if [ -z "$DECLARED_BUMP" ] || [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Determine declared version bump produced no result — refusing to release blind."
            exit 1
          fi

          if [ "$DECLARED_BUMP" != "patch" ]; then
            echo "Declared bump is '$DECLARED_BUMP' — a schema change is allowed to ship in it"
            exit 0
          fi

          # No tag to diff against means a first release, which has no previously-shipped schema
          # for a migration to have changed.
          if ! git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "No v${CURRENT_VERSION} tag to diff against — first release, nothing to enforce"
            exit 0
          fi

          NEW_MIGRATION_FILES=$(git --no-pager diff --name-only "v${CURRENT_VERSION}" "$GITHUB_SHA" -- migrations/ || true)
          if [ -n "$NEW_MIGRATION_FILES" ]; then
            echo "$NEW_MIGRATION_FILES"
            echo "::error::migrations/ changed since v${CURRENT_VERSION} but every pending changeset declares only 'patch'. A schema change must ship as at least a minor. Add a changeset with a 'minor' bump for an @mj-biz-apps/* package, then re-run."
            exit 1
          fi
          echo "No migrations changed since v${CURRENT_VERSION} — a patch release is in policy"

      # RELEASE READINESS, and the only place this runs. PRs contribute declarative JSON under
      # metadata/ and no Metadata_Sync migration; the build engineer generates ONE consolidated seed
      # per release from a clean database (MJ/metadata/CLAUDE.md §1b and §10). Nothing on a feature
      # PR can tell whether that has happened yet, and asking every PR would re-impose the per-PR
      # cadence MJ rules out — so the question is asked HERE, at the release, where the answer is
      # actionable: does every primaryKey declared under metadata/ appear in a shipped migration?
      #
      # A red step means the release seed has not been regenerated. Fix it by generating the
      # Metadata_Sync (migrations/README.md) — never by editing this step. It sits before `Update
      # version`, `Publish to npm` and the tag, so a failure here costs nothing but a re-run.
      #
      # The self-test runs first, for the reason the check exists at all: a gate nobody has watched
      # fail is indistinguishable from one that returns "pass" unconditionally, which is precisely
      # how its predecessor went green over a record that shipped nowhere (#105). Node stdlib only,
      # so neither needs anything installed.
      - name: Release readiness (every metadata record is in the shipped seed)
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          node scripts/check-release-seed-coverage.spec.mjs
          npm run check:release-seed

      # The OTHER half of #105, and the one coverage structurally cannot ask. Coverage answers "is
      # this ID named by some shipped migration?" — a per-PR seed delta satisfies that perfectly
      # while being exactly the cadence #105 abolished, so coverage would go green over it forever.
      # This asks whether the release ships ONE consolidated seed or a pile of per-PR deltas.
      #
      # Separate step, not folded into the one above, so a red run names the rule that broke. It is
      # also a separate SCRIPT because it needs git tags to know what has shipped, and the coverage
      # check is deliberately pure-fs so it runs on any checkout — `fetch-depth: 0` and
      # `fetch-tags: true` on this job's checkout are what make the tags available here.
      #
      # EXPECT THIS RED ON THE FIRST RELEASE AFTER #105 MERGES. Two unreleased Metadata_Sync deltas
      # are on `next` right now (Designer_Taxonomy, OnSubmit_Params). Neither has ever been in a
      # release tag, so neither is append-only history, and both are meant to be folded into the
      # first consolidated seed. Red here is the check doing its job, not a defect: generate the
      # seed per migrations/README.md, delete the two deltas, re-run.
      - name: Release readiness (one consolidated seed, not per-PR deltas)
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          node scripts/check-release-seed-cadence.spec.mjs
          npm run check:seed-cadence

      - name: Determine next expected version
        if: steps.changeset_check.outputs.pending != '0' && github.ref == 'refs/heads/main' && !github.event.inputs.targetVersion
        id: version_check
        env:
          CURRENT_VERSION: ${{ steps.declared_bump.outputs.CURRENT_VERSION }}
          DECLARED_BUMP: ${{ steps.declared_bump.outputs.DECLARED_BUMP }}
        run: |
          # Purely a prediction of what `changeset version` is about to do, so that the guard in
          # the next step can catch the two disagreeing. It is a function of DECLARED_BUMP and
          # nothing else — any other input here would be predicting a different program.
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          NEXT_MAJOR_VERSION="$(( ${VERSION_PARTS[0]} + 1 )).0.0"
          NEXT_MINOR_VERSION="${VERSION_PARTS[0]}.$(( ${VERSION_PARTS[1]} + 1 )).0"
          NEXT_PATCH_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$(( ${VERSION_PARTS[2]} + 1 ))"

          case "$DECLARED_BUMP" in
            major) EXPECTED_NEXT_VERSION="$NEXT_MAJOR_VERSION" ;;
            minor) EXPECTED_NEXT_VERSION="$NEXT_MINOR_VERSION" ;;
            *)     EXPECTED_NEXT_VERSION="$NEXT_PATCH_VERSION" ;;
          esac
          echo "Expected next version: $EXPECTED_NEXT_VERSION"
          echo "EXPECTED_NEXT_VERSION=$EXPECTED_NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          EXPECTED_NEXT_VERSION="${{ github.event.inputs.targetVersion || steps.version_check.outputs.EXPECTED_NEXT_VERSION }}"
          echo "Expected next version: $EXPECTED_NEXT_VERSION"

          pnpm run version

          NEXT_VERSION=$(jq -r .version packages/Entities/package.json)
          echo "Actual next version: $NEXT_VERSION"

          if [ -n "$EXPECTED_NEXT_VERSION" ] && [ "$NEXT_VERSION" != "$EXPECTED_NEXT_VERSION" ]; then
            echo "::error::Version mismatch! Expected $EXPECTED_NEXT_VERSION but got $NEXT_VERSION"
            exit 1
          fi

      - name: Sync mj-app.json version and MJ version range
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          # Sync app version from entities package
          VERSION=$(jq -r .version packages/Entities/package.json)
          jq --arg v "$VERSION" '.version = $v' mj-app.json > mj-app.json.tmp
          mv mj-app.json.tmp mj-app.json
          echo "Updated mj-app.json version to $VERSION"

          # Derive mjVersionRange from the @memberjunction/core dependency
          MJ_DEP=$(jq -r '.dependencies["@memberjunction/core"] // .peerDependencies["@memberjunction/core"] // empty' packages/Entities/package.json)
          if [ -n "$MJ_DEP" ]; then
            # Strip semver range prefix (^, ~, >=, etc.) to get the base version
            MJ_MIN=$(echo "$MJ_DEP" | sed 's/^[^0-9]*//')
            # Next major = current major + 1
            MJ_NEXT_MAJOR="$(( $(echo "$MJ_MIN" | cut -d. -f1) + 1 )).0.0"
            MJ_RANGE=">=${MJ_MIN} <${MJ_NEXT_MAJOR}"
            jq --arg r "$MJ_RANGE" '.mjVersionRange = $r' mj-app.json > mj-app.json.tmp
            mv mj-app.json.tmp mj-app.json
            echo "Updated mj-app.json mjVersionRange to $MJ_RANGE"
          fi

      - name: Build all packages
        run: pnpm run build:packages

      # Four consecutive releases (0.2.0, 0.2.1, 0.3.0, 0.4.0) shipped forms-ng without its <mj-form>
      # browser bundle, so every public form rendered an empty shell. Nothing failed at build, test or
      # boot time — the artifact was simply absent from the tarball. This is the last point at
      # which that is still catchable.
      - name: Validate the forms-ng widget bundle will ship
        run: ./.github/scripts/validate-widget-bundle.sh

      - name: Publish to npm
        if: steps.changeset_check.outputs.pending != '0'
        run: pnpm exec changeset publish

      - name: Get version and create tag
        if: steps.changeset_check.outputs.pending != '0'
        id: get_version
        run: |
          git pull
          VERSION="v$(jq -r .version packages/Entities/package.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "## Published $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: steps.changeset_check.outputs.pending != '0'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: pnpm run commitpush

      - name: Merge main into next and update lockfile
        if: steps.changeset_check.outputs.pending != '0'
        run: |
          git checkout next
          pnpm run mergemain:update-lock
