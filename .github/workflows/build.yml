name: Build and Test

on:
  workflow_dispatch:
  # `main` as well as `next`. This workflow was filtered to `[next]` on both triggers, so a pull
  # request whose base is `main` — every next → main release promotion — never started it at all.
  # Once `build-and-test` is a required check on protect-main, that is a permanent deadlock on the
  # release PR. See #173.
  #
  # No `paths:` filter either. A workflow skipped by `on: paths:` creates NO check run, so the PR
  # hangs on "Expected — Waiting for status" forever; a job or step skipped by an `if:` reports
  # `skipped`, which a required check treats as passing. The path list therefore moved down into
  # the `scope` job — a job-level `if:` here, though `distribution-gate.yml` makes the same move at
  # step level for its one expensive step. Either is fine; `on: paths:` never is.
  push:
    branches: [next, main]
  pull_request:
    branches: [next, main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Answers one question — is there anything here for build-and-test to do? — and nothing else.
  # It exists because the path list can no longer live in `on:` (see the header above), and a
  # job-level `if:` cannot read a diff by itself.
  #
  # The list below is the one that used to sit under `on: paths:`, carried over unchanged, and the
  # reasons each entry earns its place are unchanged too:
  #   - apps/**   the MJAPI dev harness is a workspace member, so its package.json participates in
  #               the lockfile and its code is what a developer's live verification actually runs.
  #   - .github/scripts/** and .github/workflows/**: the gates themselves live here, and a PR
  #               editing only a gate must still run the gate. Four releases shipped without the
  #               widget bundle because it did not. Widened from just this file to the whole
  #               directory by #177: check-release-pushes.mjs reads EVERY workflow, so a push to a
  #               ruleset-protected branch reintroduced in any of them must fail a check that
  #               actually ran. The cost is that a workflow-only PR now runs the full job; that is
  #               the intended side of the trade, because the alternative is a green required check
  #               over a gate that never executed.
  #   - ci/       the release scripts that pushed straight to `main` and `next` lived here (#177).
  #               The directory is gone; the entry is not, because it is a pattern for a directory
  #               that must fail the gate if it ever comes back. An absent path is inert.
  #   - migrations/  NOT only the migration gates' business. packages/Entities/src/contracts/
  #               question-types.spec.ts reads every file in migrations/, extracts the last
  #               CK_FormQuestion_QuestionType CHECK, and asserts it equals the hand-written
  #               FORM_QUESTION_TYPES union — under `vitest run`, i.e. inside `npm test`, i.e. here.
  #               A migration-only PR is the normal shape for a DDL change (check-codegen-append
  #               CHECK 2 wants the CodeGen output appended INTO the migration file), so without
  #               this entry the most ordinary schema PR there is skips the suite that validates it
  #               and reports `skipped` = pass.
  #   - .claude/  same argument, for the hook specs: `lint:hook-guard:test` and `lint:git-gate:test`
  #               run nowhere else in this repo, so a PR editing only a hook must still run this
  #               job — otherwise the PR that disables a hook is exactly the PR that skips the
  #               hook's own test.
  #
  # The four ROOT-LEVEL build inputs below were never in the `on: paths:` list either, because a
  # `packages/**`-shaped glob cannot reach the repository root. That cost nothing while this check
  # was advisory — the workflow just did not run and nobody was blocked. It is not free now: a
  # missing entry skips this job, `skipped` reports SUCCESS to a required status check, and the
  # pull request goes green over a build that never ran. Verified rather than assumed: perturbing
  # tsconfig.server.json and running `npx turbo typecheck --force` goes from 9 successful to
  # `error TS2688`, 0 of 2 — a red CI run that would have merged green.
  #   - tsconfig.angular.json / tsconfig.server.json
  #               the `extends` targets of all five package tsconfigs.
  #   - pnpm-workspace.yaml
  #               workspace members and `linkWorkspacePackages`; it decides what
  #               `pnpm install --frozen-lockfile` even produces.
  #   - .npmrc    `auto-install-peers` and the `@mj-biz-apps` registry, same argument.
  # scripts/check-paths-touched.spec.mjs pins each of these, so shortening this list fails a
  # required check rather than quietly widening the hole.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The decision is a diff against the base, which shallow history does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The decider runs before it is trusted. Its restrictive-direction failure reports SUCCESS,
      # so an unwatched decider is indistinguishable from one that always says "nothing to do".
      - name: Check the path decider still fires
        run: npm run lint:paths-touched:test

      - name: Does this change touch anything build-and-test reads?
        id: decide
        env:
          # A pull_request diffs against its base; a push diffs against what was there before it.
          # A workflow_dispatch has neither, which check-paths-touched.mjs treats as fail-open.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          RELEVANT=$(node scripts/check-paths-touched.mjs "$BASE_SHA" "$HEAD_SHA" \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            .npmrc \
            turbo.json \
            package.json \
            tsconfig.angular.json \
            tsconfig.server.json \
            packages/ \
            apps/ \
            scripts/ \
            smoke/ \
            migrations/ \
            .github/scripts/ \
            .claude/ \
            .github/workflows/ \
            ci/)
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          echo "build-and-test relevant: $RELEVANT"

  build-and-test:
    needs: scope
    # A job skipped by this `if:` reports conclusion `skipped`, and a required status check treats
    # `skipped` as passing — which is the entire reason the path list moved out of `on:`. Do not
    # move it back.
    #
    # The `needs.scope.result != 'success'` half is not defensive padding. A job `if:` is implicitly
    # ANDed with `success()` over its `needs`, so without it a FAILING scope job — the self-test
    # catching a broken decider, say — would skip this job, report `skipped`, and count as a passing
    # required check over a build that never ran. `scope` is not itself a required context, so its
    # red X would block nothing. This is the same fail-open rule check-paths-touched.mjs applies to
    # its own uncertainty, enforced one level up: if the decider could not decide, build.
    #
    # `!cancelled()` stays, not `always()`, even though a manually cancelled run on the head SHA
    # leaves this job reporting `skipped` — which counts as passing. That is a real gap, and the
    # trade was made deliberately rather than missed:
    #   - `always()` in its place would close it, but GitHub's own guidance warns `always()` keeps a
    #     job running after cancellation is requested, and this workflow sets
    #     `concurrency: cancel-in-progress: true` — so every superseded push could start a 30-minute
    #     build that nothing stops.
    #   - The residual exposure is therefore a deliberate manual cancel on the head SHA by someone
    #     with write access, which is visible in the run list — not a silent green.
    #   - That trade is the reason for the choice; revisit it if the concurrency group ever changes.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      # A gate whose own test is not wired into CI is a gate nobody is checking — and this one
      # spent its whole life unable to detect the mis-casing it exists for.
      - name: CI guard script tests
        run: ./.github/scripts/__tests__/validate-package-lock-case.test.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages

      # Specs were excluded from tsc in every package and Vitest does not type-check, so nothing in
      # this repo had ever compiled a test file. Seventy errors accumulated, including a call to a
      # signature that had been replaced — which passed, for the wrong reason. After the build
      # because specs import sibling packages' dist types.
      - name: Typecheck (including specs)
        run: npm run typecheck

      # Same gate publish.yml runs, pulled forward so a PR that breaks the widget bundle fails
      # here rather than silently shipping a form that never renders.
      - name: Validate the forms-ng widget bundle will ship
        run: ./.github/scripts/validate-widget-bundle.sh

      # 434 tests existed in this repo with no workflow running them, so a PR could go
      # green with the whole suite red. Runs after the build because turbo's `test` task
      # dependsOn ^build.
      - name: Run tests
        run: npm test

      # Product-code mutation gate. Seventeen guards this repo's comments call load-bearing could
      # be deleted with the suite green — every one in a source-text spec. This runs each package
      # suite under one neutralising edit per declared guard and fails if any stays green. After
      # `Run tests` because it needs the baseline green, and after the build because the packages
      # import each other's dist. Its own spec runs first and also checks every anchor still matches.
      - name: Guard-mutation gate
        run: npm run lint:guard-mutants:test && npm run lint:guard-mutants

      # Stdlib-only, like the gate specs under scripts/. The hook refuses hand edits of CodeGen
      # output, and its failure mode is SILENCE — it allows, and nothing says so. Two bypasses have
      # already shipped in it: NotebookEdit names its target `notebook_path` rather than
      # `file_path`, and the path pattern was case-sensitive while Windows and macOS both mount
      # case-insensitive, so one shifted capital walked straight past it. The suite pins both, and
      # the allow-cases stop a future "deny everything" from passing as a fix.
      - name: Generated-edit hook tests
        run: npm run lint:hook-guard:test

      # Same reasoning as the step above, for the other hook. Its failure mode is also SILENCE: if
      # `isGitWriteCommand` stops matching, every commit sails through and nothing says so. The
      # allow-cases in the spec are what stop a future "deny everything" from passing as a fix.
      - name: Commit-gate hook tests
        run: npm run lint:git-gate:test

      # #177. Stdlib-only, like the gate specs above. The defect it guards is invisible until a
      # release: a push to `main` or `next` reintroduced in any workflow or script breaks nothing in
      # the pull request that adds it, and then stops the next release with GH013 — months later, in
      # someone else's change. Its own spec runs first, and carries the allow-cases (tag pushes,
      # unprotected branches, commented-out history) that stop a future "deny everything" passing as
      # a fix.
      - name: Release-push gate
        run: npm run lint:release-pushes:test && npm run lint:release-pushes

      # #211. The defect class here is invisible to everything else in this repo: an exact version in
      # a `peerDependencies` block is a string only the CONSUMING host's npm resolver ever evaluates.
      # pnpm reads peer ranges here (`auto-install-peers=true`) but never has to CHOOSE on this one:
      # packages/Angular anchors @angular/cdk at exactly one patch in devDependencies (21.2.14 today,
      # 21.1.3 when #211 shipped), which satisfies
      # the exact peer and the caret alike, so no resolver in this repo can tell them apart and no
      # unit test can reach the difference. `@angular/cdk` shipped
      # pinned to one patch in six consecutive releases behind that blind spot, and every host not on
      # exactly that build installed Forms and got a Disabled app blaming npm auth. Its own spec runs
      # first, and carries the cases (carets, comparator and hyphen ranges, the documented
      # type-graphql allowance) that stop a future "flag everything" passing as a fix.
      #
      # Scope note: this answers whether a peer is WRITTEN exact, not whether a host's installed
      # version can satisfy the range — the `^6.1.0-edge.5` MJ peers are where those two diverge.
      - name: Peer-range gate
        run: npm run lint:peer-ranges:test && npm run lint:peer-ranges

      # Same shape: mj-app.json's version and mjVersionRange are derived, not typed, and publish.yml
      # only CHECKS them now (#177) rather than writing them. Drift caught here is a one-line fix;
      # caught at release it is a red publish run.
      - name: App version derivation tests
        run: node --test scripts/sync-app-version.spec.mjs

      # Same shape again, and the same reason it is a script at all: the release plan decides whether
      # a run publishes and whether it tags, and a decision that only ever executes inside a release
      # cannot be proven by running a release. Its spec pins the partial-publish and missing-tag
      # states that made a retry a silent green no-op.
      - name: Release plan tests
        run: npm run lint:release-plan:test

      # The other half of the same argument, one step earlier in the release: release-prep.mjs
      # decides whether a release may be cut at all and what version it is, and #177 left that
      # decision to a runbook nobody has ever executed. Its spec pins every blocker — including the
      # stale-`main` one, which is invisible until a release PR refuses to merge — and the
      # postconditions that catch the prediction disagreeing with what `changeset version` produced.
      - name: Release prep tests
        run: npm run lint:release-prep:test

      # Duplicated deliberately. The `scope` job above also runs this spec, but `scope` is not
      # itself a required context — a PR that weakened it would show a red X there that blocks
      # nothing. This copy runs inside `build-and-test`, which IS required, so a weakened spec here
      # fails a check the merge actually depends on.
      - name: Path decider spec (required-job copy)
        run: npm run lint:paths-touched:test

      # Stdlib-only and databaseless. Pins the ONE metadata record that the v0.12 consolidation
      # silently dropped (#111): the retired V202608182130 corrected the Designer Template's
      # Description as well as its prompt body, and a push cannot re-emit a correction when BOTH
      # the generation database and metadata/ still hold the superseded text — two equal stale
      # sides produce no diff. README says no general gate can catch that class; this pins the
      # instance, so a future regeneration cannot drop the correction again without going red.
      - name: Designer template description tests
        run: npm run lint:designer-template:test

      # Stdlib-only and databaseless. The shared dev database this repo regenerates metadata
      # against still holds `DefaultForNewUser = 0` for Forms, so a `mj sync pull` writes `false`
      # back into the JSON without anyone typing it. Nothing else in the repo reads this field --
      # the build, the unit suites and the checked-in generated files are all identical either way
      # -- which is how the Forms app shipped unreachable from every host launcher for four
      # releases before anyone noticed (#212).
      - name: Forms application stays launcher-visible (#212)
        run: npm run lint:forms-application:test

      # The host-truth build itself is too expensive for a pull request and runs in its own workflow.
      # Its LOGIC is cheap, and a gate whose own test only runs when the gate runs is a gate nobody
      # is checking.
      - name: Host-truth convergence gate tests
        run: npm run check:host-truth:test

      # Stdlib-only and databaseless, like the two gate specs under scripts/. It guards the check
      # that stops a smoke suite mutating a seeded fixture on a form that does not run it — a
      # failure whose whole character is that the run still looks like it passed.
      - name: Smoke fixture wiring check tests
        run: node smoke/lib/fixture.spec.mjs

      # Also stdlib-only. Guards the session options every sqlcmd batch runs under: a filtered
      # index added to any Forms table makes SQL Server refuse writes from a QUOTED_IDENTIFIER=OFF
      # session, which is sqlcmd's default and nothing else's, so the break lands only here.
      - name: Smoke sqlcmd session-option tests
        run: node smoke/lib/sqlcmd.spec.mjs

      # Stdlib-only. Every smoke script asks one helper which server it is testing; one script had
      # drifted to a hardcoded default and would have reported another checkout's behaviour as the
      # branch's. Also covers the in-process smokes' claim on their own port and public URL.
      - name: Smoke target resolution tests
        run: node smoke/lib/target.spec.mjs
