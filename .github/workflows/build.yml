name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'package-lock.json'
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'smoke/**'
      - 'turbo.json'
      - 'package.json'
  pull_request:
    branches: [next]
    paths:
      - 'package-lock.json'
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'smoke/**'
      - 'turbo.json'
      - 'package.json'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:packages

      # 434 tests existed in this repo with no workflow running them, so a PR could go
      # green with the whole suite red. Runs after the build because turbo's `test` task
      # dependsOn ^build.
      - name: Run tests
        run: npm test
