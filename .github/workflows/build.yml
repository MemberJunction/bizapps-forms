name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'
      # The MJAPI dev harness is a workspace member, so its package.json participates in the
      # lockfile and its code is what a developer's live verification actually runs. Without
      # this, a PR editing only apps/** runs no workflow at all and reports green — the same
      # silently-not-running failure class the note below describes.
      - 'apps/**'
      - 'scripts/**'
      - 'smoke/**'
      - 'turbo.json'
      - 'package.json'
      # The gates themselves live here. Without this, a PR that edits ONLY
      # .github/scripts/validate-widget-bundle.sh does not run this workflow, so a broken gate
      # reports green — which is the same class of failure (a check that silently does not run)
      # that let four releases ship without the widget bundle.
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'
      # The MJAPI dev harness is a workspace member, so its package.json participates in the
      # lockfile and its code is what a developer's live verification actually runs. Without
      # this, a PR editing only apps/** runs no workflow at all and reports green — the same
      # silently-not-running failure class the note below describes.
      - 'apps/**'
      - 'scripts/**'
      - 'smoke/**'
      - 'turbo.json'
      - 'package.json'
      # The gates themselves live here. Without this, a PR that edits ONLY
      # .github/scripts/validate-widget-bundle.sh does not run this workflow, so a broken gate
      # reports green — which is the same class of failure (a check that silently does not run)
      # that let four releases ship without the widget bundle.
      - '.github/workflows/build.yml'
      - '.github/scripts/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      # A gate whose own test is not wired into CI is a gate nobody is checking — and this one
      # spent its whole life unable to detect the mis-casing it exists for.
      - name: CI guard script tests
        run: ./.github/scripts/__tests__/validate-package-lock-case.test.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages

      # Same gate publish.yml runs, pulled forward so a PR that breaks the widget bundle fails
      # here rather than silently shipping a form that never renders.
      - name: Validate the forms-ng widget bundle will ship
        run: ./.github/scripts/validate-widget-bundle.sh

      # 434 tests existed in this repo with no workflow running them, so a PR could go
      # green with the whole suite red. Runs after the build because turbo's `test` task
      # dependsOn ^build.
      - name: Run tests
        run: npm test

      # Stdlib-only and databaseless, like the two gate specs under scripts/. It guards the check
      # that stops a smoke suite mutating a seeded fixture on a form that does not run it — a
      # failure whose whole character is that the run still looks like it passed.
      - name: Smoke fixture wiring check tests
        run: node smoke/lib/fixture.spec.mjs
