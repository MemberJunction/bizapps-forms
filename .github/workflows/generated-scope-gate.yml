name: Generated Schema Scope Gate

# Catches an unscoped CodeGen run leaking sibling-schema artifacts (bizapps-common /
# bizapps-tasks) into the Forms packages. That leak makes MJAPI fail to start with a
# duplicate GraphQL type error whenever forms-server is installed next to its own
# dependencies — i.e. in every real deployment. See issue #10.

on:
  workflow_dispatch:
  # `push` as well as `pull_request`: the PR trigger alone would let a direct commit
  # to next/main land unscoped generated output without the gate ever running.
  # No `paths:` filter: this gate is a required check, and a workflow skipped by `on: paths:`
  # creates no check run at all, which hangs the pull request on "Expected" forever. It costs 0.4s
  # to simply always run. See #173.
  push:
    branches: [next, main]
  pull_request:
    branches: [next, main]

concurrency:
  group: generated-scope-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-scope-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No dependencies needed — the checker is plain Node stdlib.
      - name: Self-test the checker
        run: node scripts/check-generated-schema-scope.mjs --self-test

      - name: Run generated-output schema-scope gate
        run: npm run lint:generated

      # Same artifacts, different failure: output emitted by a CodeGen newer than this repo's MJ
      # pin. It cannot be caught locally — `ng-base-forms` is symlinked into the MJ checkout there,
      # so the templates type-check against 6.x — and it has already broken the Angular build twice.
      - name: Run generated-output API compatibility gate
        run: npm run lint:codegen-compat:test && npm run lint:codegen-compat
