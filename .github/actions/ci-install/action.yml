# Installs dependencies for a CI job. Shared by every BizApps Open App; keep the copies identical
# (the open-app-template carries the source copy, and a new repo starts from it).
#
# Two modes, chosen from the event:
#
#   next       A pull request into `next`, or a push or dispatch on `next`. The app is built
#              against MemberJunction `next` and every sibling Open App's `next`, from source, in
#              one pnpm workspace generated by MJ's own `mj dev workspace` code. That is how the
#              family develops, so `next` is green exactly when it builds against what it will
#              ship with. Nothing waits for a weekly MJ edge build, and a change that MJ `next`
#              breaks turns red here the same day instead of at the next release.
#
#   published  Everything else: release PRs into `main`, `lts/*` lines and their backports. The
#              committed lockfile is installed as-is (`pnpm install --frozen-lockfile`), so a
#              release is built against the published MJ and sibling versions its ranges claim,
#              which is what a host installs.
#
# The steps after this one (build, typecheck, tests) are unchanged in both modes.
name: CI install
description: Install for CI — MJ next workspace on next, the committed lockfile everywhere else.

inputs:
  github-token:
    description: Token used to read MJ's workflow runs and download its build artifact.
    default: ${{ github.token }}
  published-install:
    description: The install command for published mode.
    default: pnpm install --frozen-lockfile
  mode:
    description: auto (from the event), next, or published.
    default: auto

runs:
  using: composite
  steps:
    - name: Choose the install mode
      id: mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        REF: ${{ github.ref }}
      run: |
        mode="$MODE"
        if [ "$mode" = auto ]; then
          if { [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; } && [ "$BASE_REF" = next ]; then
            mode=next
          elif [ "$EVENT" != pull_request ] && [ "$EVENT" != pull_request_target ] && [ "$REF" = refs/heads/next ]; then
            mode=next
          else
            mode=published
          fi
        fi
        case "$mode" in next|published) ;; *) echo "::error::ci-install: unknown mode '$mode'"; exit 1 ;; esac
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "ci-install mode: $mode"

    - name: Install the committed lockfile (published mode)
      if: steps.mode.outputs.mode == 'published'
      shell: bash
      run: ${{ inputs.published-install }}

    - name: Clone MJ next and sibling apps, generate the workspace
      id: prepare
      if: steps.mode.outputs.mode == 'next'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/mj-next-workspace.mjs" prepare

    - name: Install the workspace
      if: steps.mode.outputs.mode == 'next'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/mj-next-workspace.mjs" install

    - name: Fetch MJ's build of that commit
      id: artifact
      if: steps.mode.outputs.mode == 'next'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/mj-next-workspace.mjs" fetch-dist

    - name: Restore a cached MJ build
      id: cache
      if: steps.mode.outputs.mode == 'next' && steps.artifact.outputs.found != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.prepare.outputs.mj-dir }}/packages/**/dist
        key: ${{ steps.prepare.outputs.dist-key }}

    - name: Build MJ (if needed) and the sibling apps
      if: steps.mode.outputs.mode == 'next'
      shell: bash
      env:
        MJ_DIST_READY: ${{ steps.artifact.outputs.found == 'true' || steps.cache.outputs.cache-hit == 'true' }}
      run: node "$GITHUB_ACTION_PATH/mj-next-workspace.mjs" build

    - name: Cache the MJ build
      if: steps.mode.outputs.mode == 'next' && steps.artifact.outputs.found != 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.prepare.outputs.mj-dir }}/packages/**/dist
        key: ${{ steps.prepare.outputs.dist-key }}
